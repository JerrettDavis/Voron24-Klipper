# ERCF / Happy Hare controls on the stock Mini12864 screen.
# Adds "ERCF" to the main menu (all common actions + the full ERCF calibration set).
# Calibration menu lives in calibration_menu.cfg.
# Command names follow Happy Hare v4 and are UNVERIFIED on the live printer until it is back online (run tools/validate.sh).

[menu __main __ercf]
type: list
name: ERCF

[menu __main __ercf __status]
type: command
name: Status
gcode: MMU_STATUS

[menu __main __ercf __home]
type: command
name: Home selector
enable: {not printer.idle_timeout.state == "Printing"}
gcode: MMU_HOME

[menu __main __ercf __tool]
type: list
name: Tools

[menu __main __ercf __tool __sel]
type: input
name: Select T{'%2d' % menu.input}
input: 0
input_min: 0
input_max: 11
input_step: 1
gcode: MMU_SELECT TOOL={menu.input|int}

[menu __main __ercf __tool __change]
type: input
name: Change to T{'%2d' % menu.input}
input: 0
input_min: 0
input_max: 11
input_step: 1
gcode: MMU_CHANGE_TOOL TOOL={menu.input|int}

[menu __main __ercf __tool __load]
type: command
name: Load filament
gcode: MMU_LOAD

[menu __main __ercf __tool __unload]
type: command
name: Unload filament
gcode: MMU_UNLOAD

[menu __main __ercf __tool __eject]
type: command
name: Eject to gate
gcode: MMU_EJECT

[menu __main __ercf __tool __preload]
type: input
name: Preload gate {'%2d' % menu.input}
input: 0
input_min: 0
input_max: 11
input_step: 1
gcode: MMU_PRELOAD GATE={menu.input|int}

[menu __main __ercf __tool __check]
type: command
name: Check all gates
gcode: MMU_CHECK_GATE ALL=1

[menu __main __ercf __recover]
type: list
name: Recovery

[menu __main __ercf __recover __auto]
type: command
name: Auto recover
gcode: MMU_RECOVER

[menu __main __ercf __recover __retry]
type: command
name: Retry load (gate)
gcode: MMU_LOAD_RETRY

[menu __main __ercf __recover __loaded]
type: command
name: Mark: loaded
gcode: MMU_RECOVER LOADED=1

[menu __main __ercf __recover __unloaded]
type: command
name: Mark: unloaded
gcode: MMU_RECOVER LOADED=0

[menu __main __ercf __recover __pause]
type: command
name: Resume print
enable: {printer.pause_resume.is_paused}
gcode: MMU_UNLOCK
       RESUME

[menu __main __ercf __recover __unlock]
type: command
name: Unlock MMU
gcode: MMU_UNLOCK

[menu __main __ercf __servo]
type: list
name: Servo/Motors

[menu __main __ercf __servo __up]
type: command
name: Servo up
gcode: MMU_SERVO POS=up

[menu __main __ercf __servo __move]
type: command
name: Servo move
gcode: MMU_SERVO POS=move

[menu __main __ercf __servo __down]
type: command
name: Servo down (grip)
gcode: MMU_SERVO POS=down

[menu __main __ercf __servo __off]
type: command
name: Motors off
gcode: MMU_MOTORS_OFF

[menu __main __ercf __servo __sync]
type: command
name: Sync gear+extr on
gcode: MMU_SYNC_GEAR_MOTOR SYNC=1

[menu __main __ercf __servo __unsync]
type: command
name: Sync gear+extr off
gcode: MMU_SYNC_GEAR_MOTOR SYNC=0

[menu __main __ercf __opts]
type: list
name: Options

[menu __main __ercf __opts __clog_on]
type: command
name: Clog detect: auto
gcode: MMU_SYNC_FEEDBACK ENABLE=1

[menu __main __ercf __opts __clog_off]
type: command
name: Clog detect: off
gcode: MMU_SYNC_FEEDBACK ENABLE=0

[menu __main __ercf __opts __spool_on]
type: command
name: Endless spool: on
gcode: MMU_ENDLESS_SPOOL ENABLE=1

[menu __main __ercf __opts __spool_off]
type: command
name: Endless spool: off
gcode: MMU_ENDLESS_SPOOL ENABLE=0

[menu __main __ercf __opts __bypass]
type: command
name: Select bypass
gcode: MMU_SELECT_BYPASS

[menu __main __ercf __opts __wipe]
type: command
name: Wipe nozzle
gcode: CLEAN_NOZZLE

[menu __main __ercf __cal]
type: list
name: ERCF calibrate

[menu __main __ercf __cal __selector]
type: command
name: Selector offsets
gcode: MMU_CALIBRATE_SELECTOR

[menu __main __ercf __cal __gear]
type: input
name: Gear gate {'%2d' % menu.input}
input: 0
input_min: 0
input_max: 11
input_step: 1
gcode: MMU_CALIBRATE_GEAR GATE={menu.input|int}

[menu __main __ercf __cal __encoder]
type: command
name: Encoder
gcode: MMU_CALIBRATE_ENCODER

[menu __main __ercf __cal __bowden]
type: command
name: Bowden length
gcode: MMU_CALIBRATE_BOWDEN

[menu __main __ercf __cal __gates]
type: command
name: All gates (offcuts)
gcode: MMU_CALIBRATE_GATES ALL=1

[menu __main __ercf __cal __toolhead]
type: command
name: Toolhead dist.
gcode: MMU_CALIBRATE_TOOLHEAD
