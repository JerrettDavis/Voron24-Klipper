# On-device calibration menu (Mini12864). "Calibrate" in the main menu.
# Macros it calls are in calibration.cfg. Long/heated actions show a notice first; stop with the knob's Emergency Stop or M112.

[menu __main __cal]
type: list
name: Calibrate

[menu __main __cal __prep]
type: list
name: Prep / level

[menu __main __cal __prep __home]
type: command
name: Home all
gcode: G28

[menu __main __cal __prep __qgl]
type: command
name: Quad gantry level
gcode: QUAD_GANTRY_LEVEL

[menu __main __cal __prep __probe]
type: command
name: Probe accuracy
gcode: CAL_PROBE_ACCURACY

[menu __main __cal __prep __mesh]
type: command
name: Bed mesh (cold)
gcode: CAL_BED_MESH

[menu __main __cal __prep __meshhot]
type: command
name: Bed mesh (hot 60C)
gcode: CAL_BED_MESH BED=60

[menu __main __cal __prep __zoff]
type: command
name: Z offset (paper)
gcode: CAL_Z_OFFSET

[menu __main __cal __heat]
type: list
name: Heaters

[menu __main __cal __heat __pidbed]
type: command
name: PID bed 60C
gcode: PID_CALIBRATE HEATER=heater_bed TARGET=60

[menu __main __cal __heat __pidext]
type: command
name: PID hotend 215C
gcode: PID_CALIBRATE HEATER=extruder TARGET=215

[menu __main __cal __heat __save]
type: command
name: Save config
gcode: SAVE_CONFIG

[menu __main __cal __motion]
type: list
name: Motion / shaper

[menu __main __cal __motion __noise]
type: command
name: Accel. noise check
gcode: CAL_ACCEL_CHECK

[menu __main __cal __motion __loose]
type: command
name: Looseness test
gcode: CAL_LOOSENESS

[menu __main __cal __motion __axes]
type: command
name: Axes map
gcode: AXES_MAP_CALIBRATION

[menu __main __cal __motion __shaper]
type: command
name: Input shaper X+Y
gcode: AXES_SHAPER_CALIBRATION

[menu __main __cal __motion __belts]
type: command
name: Belt tension
gcode: COMPARE_BELTS_RESPONSES

[menu __main __cal __motion __vib]
type: command
name: Vibration profile
gcode: CREATE_VIBRATIONS_PROFILE

[menu __main __cal __motion __maxacc]
type: command
name: Max accel test
gcode: CAL_MAX_ACCEL

[menu __main __cal __print]
type: list
name: Print tuning

[menu __main __cal __print __pa]
type: command
name: Pressure adv. tower
gcode: CAL_PA_TOWER

[menu __main __cal __print __pa_set]
type: input
name: Set PA {'%.3f' % menu.input}
input: 0.04
input_min: 0
input_max: 0.2
input_step: 0.005
gcode: SET_PRESSURE_ADVANCE ADVANCE={menu.input}

[menu __main __cal __print __extrude]
type: command
name: Extruder e-steps
gcode: CAL_EXTRUDER

[menu __main __cal __print __flow]
type: command
name: Flow cube notes
gcode: CAL_FLOW_NOTES

[menu __main __cal __report]
type: command
name: Snapshot report
gcode: CAL_SNAPSHOT
