# Commands some slicers (OrcaSlicer, Bambu Studio) emit that this printer does not define.
# They must not stop a print with "Unknown command". Included last from printer.cfg.
#
# Chamber temperature is owned by Klippain: START_PRINT CHAMBER=<temp> runs the chamber soak (HEATSOAK_CHAMBER,
# timeout print_default_chamber_max_heating_time) and the Nevermore (fan_generic filter) via START_FILTER with the
# per-material filter_speed in variables.cfg. So these only log, to keep one source of truth and avoid a double soak.

[gcode_macro M141]
description: Slicer chamber setpoint (ignored; START_PRINT CHAMBER= handles it)
gcode:
    RESPOND MSG="M141 S{params.S|default(0)} ignored: chamber setpoint comes from START_PRINT CHAMBER="

[gcode_macro M191]
description: Slicer chamber wait (ignored; START_PRINT CHAMBER= handles it)
gcode:
    RESPOND MSG="M191 S{params.S|default(0)} ignored: chamber soak is done by START_PRINT"
