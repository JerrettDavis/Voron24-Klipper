# One-command recovery after a failed MMU load. Included last from printer.cfg.
#
# MMU_LOAD_RETRY [GATE=n]
#   For the case "Load sequence failed ... Gear moved X mm, encoder measured Y mm" (slip) or "Couldn't pick up filament at gate".
#   1. unlocks Happy Hare (restores the nozzle temperature) if it paused,
#   2. lifts and travels over the purge bucket (so any purge/ooze lands in it, never on the build plate),
#   3. clears the "gate empty" flag Happy Hare sets after a failed pickup,
#   4. runs MMU_LOAD. The post-load hook (_WIPE_AFTER_MMU_LOAD) then wipes the nozzle on the brush.
#   It does NOT resume the print: check the result, then run RESUME.
# If Happy Hare wrongly says "Filament already loaded" the filament is somewhere in the bowden: run MMU_UNLOAD first (it homes the filament
# back to the gate by encoder). Do not pull with raw MMU_TEST_MOVE further than the encoder-measured distance, or the end leaves the
# gear and has to be hand-fed again.

[gcode_macro MMU_LOAD_RETRY]
description: After a failed MMU load: unlock, go over the purge bucket, clear the empty flag, reload (then RESUME yourself)
gcode:
    {% set uv = printer["gcode_macro _USER_VARIABLES"] %}
    {% set Px, Py, Pz = uv.purge_bucket_xyz|map('float') %}
    {% set gate = params.GATE|default(printer.mmu.gate)|int %}
    {% if printer.toolhead.homed_axes != "xyz" %}
        { action_raise_error("MMU_LOAD_RETRY: home the printer first") }
    {% endif %}
    {% if gate < 0 %}
        { action_raise_error("MMU_LOAD_RETRY: no gate selected, pass GATE=n") }
    {% endif %}
    {% if printer.mmu.is_locked %}
        MMU_UNLOCK
    {% endif %}
    {% set z_up = [printer.toolhead.position.z + 5.0, Pz]|max %}
    G90
    G1 Z{z_up} F900
    G1 X{Px} Y{Py} F12000
    G1 Z{Pz} F900
    MMU_GATE_MAP GATE={gate} AVAILABLE=1
    MMU_LOAD GATE={gate}
