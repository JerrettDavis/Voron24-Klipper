# Macros behind the on-screen Calibrate menu. Safe by default: each checks homing, heats only what it needs.

[gcode_macro _CAL_HOME]
description: Home (and QGL) only if not already done
gcode:
    {% if printer.toolhead.homed_axes != "xyz" %}
        G28
    {% endif %}
    {% if not printer.quad_gantry_level.applied %}
        QUAD_GANTRY_LEVEL
    {% endif %}

[gcode_macro CAL_PROBE_ACCURACY]
description: 10-sample probe repeatability at bed centre (sd should be <0.005)
gcode:
    _CAL_HOME
    G1 X175 Y175 Z10 F6000
    PROBE_ACCURACY SAMPLES=10
    RESPOND MSG="Probe: see sd in console (<0.005 good)"

[gcode_macro CAL_BED_MESH]
description: Mesh at BED=<temp> (default cold 0 = no heating)
gcode:
    {% set bed = params.BED|default(0)|float %}
    {% if bed > 0 %}
        M190 S{bed}
        M117 Soaking 5 min
        G4 P300000
    {% endif %}
    _CAL_HOME
    BED_MESH_CALIBRATE
    {% if bed > 0 %}
        M140 S0
    {% endif %}
    RESPOND MSG="Mesh done. SAVE_CONFIG to keep."

[gcode_macro CAL_Z_OFFSET]
description: Paper-test Z offset; use the TESTZ/ACCEPT buttons in Mainsail
gcode:
    _CAL_HOME
    PROBE_CALIBRATE

[gcode_macro CAL_ACCEL_CHECK]
description: Accelerometer noise baseline (should be ~1-100)
gcode:
    MEASURE_AXES_NOISE

[gcode_macro CAL_LOOSENESS]
description: Quick resonance sweeps; a sharp extra peak or high peak count means something is loose
gcode:
    _CAL_HOME
    MEASURE_AXES_NOISE
    TEST_RESONANCES AXIS=X OUTPUT=raw_data NAME=loose_x FREQ_START=10 FREQ_END=120
    TEST_RESONANCES AXIS=Y OUTPUT=raw_data NAME=loose_y FREQ_START=10 FREQ_END=120
    RESPOND MSG="Raw data in /tmp. Run AXES_SHAPER_CALIBRATION and compare plots; extra peaks = loose parts."

[gcode_macro CAL_MAX_ACCEL]
description: Corner-ringing accel steps; watch/listen for skipped steps
gcode:
    {% set accels = [3000, 5000, 7000, 9000, 12000, 15000] %}
    _CAL_HOME
    {% for a in accels %}
        SET_VELOCITY_LIMIT ACCEL={a} ACCEL_TO_DECEL={a/2}
        {% for i in range(4) %}
            G1 X60 Y60 F30000
            G1 X290 Y290 F30000
        {% endfor %}
        RESPOND MSG="Accel {a} ok"
    {% endfor %}
    SET_VELOCITY_LIMIT ACCEL={printer.configfile.settings.printer.max_accel}
    G1 X175 Y175 F6000

[gcode_macro CAL_PA_TOWER]
description: Sets the PA ramp for a tower print (slice a 40mm tower, run before print)
gcode:
    SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY=1 ACCEL=500
    TUNING_TOWER COMMAND=SET_PRESSURE_ADVANCE PARAMETER=ADVANCE START=0 FACTOR=.005
    RESPOND MSG="Start tower print now; best layer height h => PA = h*0.005 (mm height)"

[gcode_macro CAL_EXTRUDER]
description: Extrude 100mm for e-step check (hot, mark 120mm on filament first)
gcode:
    {% set t = params.TEMP|default(215)|float %}
    M109 S{t}
    M83
    G1 E100 F60
    RESPOND MSG="Measure remaining: new_rd = old_rd * actual/100"

[gcode_macro CAL_FLOW_NOTES]
description: Reminder only
gcode:
    RESPOND MSG="Flow: print a 20mm cube 0 infill 2 walls, measure walls, flow=nominal/measured"

[gcode_macro CAL_SNAPSHOT]
description: Capture key calibration values to the console for the report
gcode:
    RESPOND MSG="mesh={printer.bed_mesh.profile_name} qgl={printer.quad_gantry_level.applied} shaper_x={printer.configfile.settings.input_shaper.shaper_freq_x} shaper_y={printer.configfile.settings.input_shaper.shaper_freq_y} max_accel={printer.configfile.settings.printer.max_accel}"
