# Bambu-style automatic nozzle wipe.
# Brush/bucket positions live in variables.cfg (_USER_VARIABLES brush_xyz / purge_bucket_xyz).
# Klippain's CLEAN_NOZZLE (macros/helpers/nozzle_cleaning.cfg) does the actual brush strokes.
#
# WIPE_NOZZLE [FORCE=1] [PURGE=1]
#   - skips (with a message) unless XYZ are homed - the brush is at an absolute Z
#   - skips if a wipe already happened in the last `min_interval` seconds (unless FORCE=1),
#     so chained triggers (QGL then mesh) do not wipe twice
#   - PURGE=1 first extrudes into the bucket (needs a loaded, hot nozzle: only use after a load)
#   - always lifts to the bucket Z afterwards so later moves clear the brush
# Triggers wired below: _CG28 (so QGL, BED_MESH_CALIBRATE, START_PRINT), END_PRINT,
# Happy Hare post-load / post-unload. START_PRINT already wipes via Klippain's "clean" action.
# G28 is not wrapped on purpose: it would have to wipe *before* Z is homed, but the brush Z is
# absolute. Wipe after unload/end of print instead so the nozzle is clean at rest.

[gcode_macro WIPE_NOZZLE]
description: Wipe the nozzle on the brush (skips if not homed or wiped recently)
variable_last_wipe: -9999
variable_min_interval: 120
gcode:
    {% set force = params.FORCE|default(0)|int %}
    {% set purge = params.PURGE|default(0)|int %}
    {% set now = printer.toolhead.estimated_print_time %}
    {% set uv = printer["gcode_macro _USER_VARIABLES"] %}
    {% set Px, Py, Pz = uv.purge_bucket_xyz|map('float') %}
    {% if not uv.purge_and_brush_enabled %}
        RESPOND MSG="WIPE_NOZZLE: brush/bucket disabled, skipped"
    {% elif printer.toolhead.homed_axes != "xyz" %}
        RESPOND MSG="WIPE_NOZZLE: XYZ not homed, skipped"
    {% elif not force and (now - last_wipe) < min_interval %}
        RESPOND MSG="WIPE_NOZZLE: wiped recently, skipped"
    {% else %}
        SAVE_GCODE_STATE NAME=WIPE_NOZZLE
        {% if purge %}
            PURGE
        {% endif %}
        CLEAN_NOZZLE
        G90
        G1 Z{Pz} F900
        RESTORE_GCODE_STATE NAME=WIPE_NOZZLE MOVE=0
        SET_GCODE_VARIABLE MACRO=WIPE_NOZZLE VARIABLE=last_wipe VALUE={printer.toolhead.estimated_print_time}
    {% endif %}

# --- pre-probe wipe: override Klippain's _CG28 (homing_conditional.cfg) ---
# Klippain's QUAD_GANTRY_LEVEL, BED_MESH_CALIBRATE (and START_PRINT) all call _CG28 first, and they
# define their own rename_existing wrappers, so wrapping those commands here would be silently
# overridden (that is why the first version never fired). This section must be included AFTER
# Klippain so it wins. PROBE_ACCURACY has no _CG28 call: run WIPE_NOZZLE by hand before it.
[gcode_macro _CG28]
description: Homing only if necessary, then wipe the nozzle (skipped if wiped recently)
gcode:
    {% set status_leds_control_enabled = printer["gcode_macro _USER_VARIABLES"].status_leds_control_enabled|default(False) %}

    {% if "xyz" not in printer.toolhead.homed_axes %}
        {% if status_leds_control_enabled %}
            STATUS_LEDS COLOR="HOMING"
        {% endif %}
        G28
        {% if status_leds_control_enabled %}
            STATUS_LEDS COLOR="READY"
        {% endif %}
    {% endif %}
    WIPE_NOZZLE

# --- END_PRINT: wipe while still hot, before heaters are turned off ---
# (added to variable_endprint_actions in variables.cfg)
[gcode_macro _END_PRINT_ACTION_WIPE]
gcode:
    WIPE_NOZZLE FORCE=1

# --- Happy Hare hooks (referenced from mmu/base/mmu_macro_vars.cfg) ---
[gcode_macro _WIPE_AFTER_MMU]
description: Wipe after a standalone MMU load/unload (never mid-print: tool changes purge on their own)
gcode:
    {% if printer.print_stats.state not in ["printing", "paused"] %}
        WIPE_NOZZLE FORCE=1
    {% endif %}
